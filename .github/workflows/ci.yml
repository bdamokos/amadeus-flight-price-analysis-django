name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check pip==26.2.1 setuptools==84.0.0
          python -m pip install --disable-pip-version-check -r requirements.txt pip-audit==2.10.1
      - name: Validate dependencies
        run: |
          python -m pip check
          python -m pip_audit --local
      - name: Run Django checks and tests
        env:
          AMADEUS_CLIENT_ID: test-client-id
          AMADEUS_CLIENT_SECRET: test-client-secret
        run: |
          python pricing/manage.py check
          python pricing/manage.py test flight_price
      - name: Smoke-test the CLI
        env:
          AMADEUS_CLIENT_ID: test-client-id
          AMADEUS_CLIENT_SECRET: test-client-secret
        run: >-
          python -m cli.flight_price_cli search BRU BUD
          --trip one-way
          --start 2026-09-01
          --end 2026-09-01
          --dry-run
      - name: Compile Python sources
        run: python -m compileall -q pricing cli
